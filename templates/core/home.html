{% extends 'core/base.html' %}
{% load static %}

{% block title %}Inicio | Web Personal{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8 col-md-10 mx-auto">
        <h2 class="section-heading mb-4 text-primary">Biografía</h2>
        <p class="lead text-secondary" style="line-height: 1.8;">
            {% if persona %}
                {{ persona.biografia }}
            {% else %}
                No hay biografía registrada.
            {% endif %}
        </p>
    </div>
</div>
{% endblock %}
