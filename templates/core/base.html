<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Web Personal{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero { background: linear-gradient(135deg, #1e293b, #0f172a); color: white; padding: 60px 0; }
        .footer { background-color: #0f172a; color: #94a3b8; padding: 20px 0; margin-top: 50px; }
        .card-custom { border: none; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">
                {% if persona %}{{ persona.nombres }} {{ persona.apellidos }}{% else %}Web Personal{% endif %}
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'home' %}">Inicio</a>
                <a class="nav-link" href="{% url 'about' %}">Sobre mí</a>
                <a class="nav-link" href="{% url 'portfolio' %}">Portafolio</a>
                <a class="nav-link" href="{% url 'contact' %}">Contacto</a>
            </div>
        </div>
    </nav>

    {% block content %}
    {% endblock %}

    <footer class="footer text-center">
        <div class="container">
            <p class="mb-0">&copy; Web Personal - Universidad Técnica de Manabí</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
